<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Steps</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mute:#78716c;--faint:#e7e5e4;--card:#fff;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--block:#dc2626;--strong:#be185d;--code:#15803d;--em:#b45309;--link:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--fg:#e7e5e4;--mute:#a8a29e;--faint:#292524;--card:#1c1a19;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--block:#f87171;--strong:#f472b6;--code:#86efac;--em:#fcd34d;--link:#7cb7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
aside{width:260px;flex:none;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 8px 16px;font-weight:600}
.root{margin:18px 8px 6px;font-size:12px;color:var(--mute);word-break:break-all}
.root.missing{color:var(--block)}
.wk{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:8px;border-radius:8px;cursor:pointer}
.wk:hover{background:var(--faint)}.wk.on{background:var(--faint);font-weight:600}
.wk small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.bar{height:4px;background:var(--faint);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .3s}
.gear{margin:24px 8px 0;background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:13px;padding:0}
.gear:hover{color:var(--fg)}
main{flex:1;min-width:0;max-width:880px;padding:40px 32px 80px}
h2.t{font-size:26px;margin:0 0 4px}
.sub{color:var(--mute);margin-bottom:28px}
.now{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:0 0 28px}
.now>summary{cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none;padding:4px 0}.now>summary::-webkit-details-marker{display:none}.now>summary::before{content:"▸";color:var(--mute);font-size:12px;transition:transform .15s}.now[open]>summary::before{transform:rotate(90deg)}
.now b.l{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:10px;font-weight:600}
.now b.l:first-child{margin-top:0}
.step{margin:0 0 6px}
.sh{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;border-top:1px solid var(--faint);user-select:none}
.sh .ch{color:var(--mute);width:12px;transition:transform .15s;flex:none}
.step.open .ch{transform:rotate(90deg)}
.sh .nm{flex:1;min-width:0}.sh .nm b{font-weight:600}.sh .nm small{display:block;color:var(--mute);font-size:12.5px}
.pill{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--faint);color:var(--mute);white-space:nowrap}
.pill.in{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.bl{background:color-mix(in srgb,var(--block) 16%,transparent);color:var(--block)}
.cnt{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;width:52px;text-align:right}
.mini{width:90px}.mini .bar{margin:0}
.body{display:none;padding:0 0 18px 24px}.step.open .body{display:block}
.it{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.ck{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--mute);margin-top:3px;display:grid;place-items:center;font-size:12px;line-height:1;color:#fff}
.it.done .ck{background:var(--ok);border-color:var(--ok)}.it.done .ck::after{content:"✓"}
.it.done .tx{color:var(--mute)}
.tx{flex:1;min-width:0}
.tg{font-size:11.5px;margin-left:8px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap}
.kv{font-size:12px;margin-left:8px;color:var(--mute);white-space:nowrap}.kv b{font-weight:500;color:var(--fg)}
.tg{cursor:pointer}.tg.on{background:var(--accent);color:#fff}
.id{flex:none;font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;padding:1px 7px;border-radius:6px;background:var(--faint);color:var(--mute);margin-top:3px;min-width:46px;text-align:center;cursor:copy;user-select:none}
.id:hover{color:var(--fg)}
.bar2{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 12px}
.bar2 .flt{margin:0}
#q{flex:1;min-width:220px;padding:8px 12px;border:0;border-radius:8px;background:var(--faint);color:inherit;font:inherit;font-size:14px;outline:none}
#q:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;align-items:center}
.tc{cursor:pointer;border:0;font:inherit;font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--faint);color:var(--mute)}
.tc:hover{color:var(--fg)}.tc.on{background:var(--accent);color:#fff}.tc small{opacity:.7;margin-left:4px}
.res{font-size:12.5px;color:var(--mute)}
.mb{font-size:11.5px;margin-left:8px;padding:0 7px;border-radius:99px;white-space:nowrap;cursor:default}
.mb.isolated{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.mb.integrated{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.df{font-size:11.5px;margin-left:8px;padding:0 7px;border-radius:99px;background:var(--faint);color:var(--mute);white-space:nowrap}
.qdh{margin:26px 0 4px;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.qc.dfr .qq{color:var(--mute)}.qm{color:var(--mute);font-size:12.5px;margin-top:6px}
.qd{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.qd[hidden]{display:none}
.qd input{flex:1;min-width:200px;border:0;border-radius:8px;background:var(--faint);color:inherit;font:inherit;font-size:14px;padding:8px 12px;outline:none}
.qd input:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}.qd .go{background:var(--accent);color:#fff}
.hd{font-size:11.5px;margin-left:8px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--block) 14%,transparent);color:var(--block);white-space:nowrap;cursor:help}
.cl{font-size:11.5px;margin-left:8px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap}
.dp{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;margin-left:8px;color:var(--mute);cursor:pointer;white-space:nowrap}
.dp:hover{color:var(--fg)}.dp.ok{opacity:.45;text-decoration:line-through}
.bk{font-size:11.5px;margin-left:8px;color:var(--warn);white-space:nowrap}
.it.blk .tx{color:var(--mute)}

.hrow{display:flex;align-items:baseline;gap:8px 18px;flex-wrap:wrap}
.docs{display:flex;gap:6px}
.db{border:0;background:var(--faint);color:var(--mute);font:inherit;font-size:12.5px;padding:3px 12px;border-radius:99px;cursor:pointer}
.db:hover{color:var(--fg)}
#docv{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
#docv[hidden]{display:none}
.dv-back{position:absolute;inset:0;background:#0005}
.dv-panel{position:relative;width:min(1120px,96vw);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-20px 0 60px #0004}
.dv-panel header{display:flex;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--faint)}
.dv-panel header b{font-weight:600}.dv-panel header .sp{flex:1}
.dv-panel header .db.on{background:var(--accent);color:#fff}
.dv-x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;line-height:1}.dv-x:hover{color:var(--fg)}
.dv-body{flex:1;min-height:0;display:flex}
#dv-toc{width:240px;flex:none;overflow:auto;padding:20px 10px 30px 20px;font-size:13px;border-right:1px solid var(--faint)}
#dv-toc a{display:block;padding:3px 0;color:var(--mute);cursor:pointer;line-height:1.35}#dv-toc a:hover{color:var(--fg)}
#dv-toc a.l3{padding-left:12px;font-size:12.5px}
#dv-art{flex:1;min-width:0;overflow:auto;padding:26px 44px 90px}
.gh{max-width:860px;font-size:15px;line-height:1.65}
.gh h1,.gh h2,.gh h3,.gh h4{line-height:1.3;margin:1.6em 0 .6em;font-weight:600}
.gh h1{font-size:1.9em;padding-bottom:.3em;border-bottom:1px solid var(--faint);margin-top:0}
.gh h2{font-size:1.45em;padding-bottom:.25em;border-bottom:1px solid var(--faint)}
.gh h3{font-size:1.2em}.gh h4{font-size:1.05em}
.gh p,.gh ul,.gh ol,.gh pre,.gh table,.gh blockquote{margin:0 0 1em}
.gh ul,.gh ol{padding-left:1.6em}.gh li{margin:.2em 0}.gh li>ul,.gh li>ol{margin:.2em 0}
.gh code{background:var(--faint);padding:.15em .4em;border-radius:5px;font:.88em ui-monospace,SFMono-Regular,Menlo,monospace}
.gh pre{background:var(--faint);padding:14px 16px;border-radius:8px;overflow:auto;line-height:1.5}
.gh pre code{background:none;padding:0;font-size:.85em}
.gh blockquote{margin-left:0;padding:.1em 1em;color:var(--mute);border-left:3px solid var(--faint)}
.gh hr{border:0;border-top:1px solid var(--faint);margin:1.6em 0}
.gh table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
.gh th,.gh td{padding:6px 12px;border-bottom:1px solid var(--faint);text-align:left;vertical-align:top}
.gh th{font-weight:600;border-bottom:2px solid var(--faint)}
.gh .rel{font:.88em ui-monospace,monospace;color:var(--mute)}
.gh li.task{list-style:none;margin-left:-1.3em}.gh .tk{display:inline-block;width:1.1em;color:var(--mute)}.gh .tk.d{color:var(--ok)}
@media(max-width:860px){#dv-toc{display:none}#dv-art{padding:20px 18px 80px}}

.qb.hot{background:var(--accent);color:#fff;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.qn{display:inline-block;margin-left:6px;min-width:18px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;text-align:center}
.rs{font-size:11.5px;margin-left:8px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);white-space:nowrap;cursor:help}
#qv{position:fixed;inset:0;z-index:55;display:flex;justify-content:flex-end}#qv[hidden]{display:none}
.qpanel{position:relative;width:min(720px,96vw);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-20px 0 60px #0004}
.qpanel header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--faint)}
.qpanel header .sp{flex:1}
#q-list{flex:1;overflow:auto;padding:18px 20px 60px}
.q-info{color:var(--mute);font-size:13px;margin:0 0 16px}
.qc{padding:14px 0 18px;border-top:1px solid var(--faint)}
.qc.new{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent);margin:0 -20px;padding:14px 20px 18px}
.qc.sent{opacity:.45;pointer-events:none}
.qh{display:flex;gap:10px;align-items:baseline;color:var(--mute);font-size:12.5px}
.qq{font-size:15.5px;font-weight:600;margin:6px 0 10px;line-height:1.45}
/* formattazione testo: colori distinti per grassetto, codice, corsivo, link */
.fx b,.fx strong,.md b,.gh b,.gh strong{color:var(--strong);font-weight:700}
.fx i,.fx em,.md i,.gh i,.gh em{color:var(--em);font-style:italic}
.fx code,.md code,.gh code{color:var(--code);background:color-mix(in srgb,var(--code) 12%,transparent)}
.gh pre code{color:inherit;background:none}
.fx a,.md a,.gh a{color:var(--link);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.fx s,.gh s{color:var(--mute)}
.qq.fx{font-weight:400;font-size:15px;line-height:1.6;white-space:pre-line}
.qq.fx b{font-weight:700}
.inote.fx{color:var(--fg)}
.qo{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.opt{border:0;background:var(--faint);color:var(--fg);font:inherit;font-size:13.5px;padding:6px 14px;border-radius:99px;cursor:pointer}
.opt:hover{background:var(--accent);color:#fff}.opt.def{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.qa input{flex:1;min-width:200px;border:0;border-radius:8px;background:var(--faint);color:inherit;font:inherit;font-size:14px;padding:8px 12px;outline:none}
.qa input:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.qa .go{background:var(--accent);color:#fff}
.qe{color:var(--block);font-size:13px;margin-top:8px}
select.sel{border:0;border-radius:8px;background:var(--faint);color:inherit;font:inherit;font-size:13px;padding:6px 8px}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:12.5px;padding:0}
.nb{flex:none;background:none;border:0;color:var(--mute);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px}
.nb:hover{background:var(--faint)}
.inote{margin:2px 0 6px 28px;padding:8px 12px;background:var(--faint);border-radius:8px;font-size:13.5px;color:var(--mute);display:none}
.inote.show{display:block}
details.n{margin:14px 0 0}details.n>summary{cursor:pointer;color:var(--mute);font-size:13px;padding:3px 0}
details.n>summary:hover{color:var(--fg)}
.md{font-size:14px;color:var(--fg)}.md h3,.md h4{font-size:14px;margin:14px 0 4px}.md p{margin:6px 0}.md ul{margin:4px 0;padding-left:20px}
.md code{background:var(--faint);padding:1px 5px;border-radius:4px;font-size:12.5px}
.md pre{background:var(--faint);padding:10px 12px;border-radius:8px;overflow:auto;font-size:12.5px}.md pre code{background:none;padding:0}
.md a{color:var(--accent)}
.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 2px;font-weight:600}
.flt{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;color:var(--mute);margin:0 0 18px;user-select:none}.flt input{accent-color:var(--accent)}
.empty{color:var(--mute);margin-top:30vh;text-align:center}
dialog{border:0;border-radius:14px;padding:24px;width:min(560px,92vw);background:var(--card);color:var(--fg);box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 4px}dialog p{color:var(--mute);margin:0 0 16px;font-size:13.5px}
.pr{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--faint)}
.pr code{flex:1;word-break:break-all;font-size:13px}
button.s{background:none;border:1px solid var(--faint);color:inherit;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
button.s:hover{background:var(--faint)}button.p{background:var(--accent);border-color:var(--accent);color:#fff}
input.t{width:100%;padding:8px 10px;border:1px solid var(--faint);border-radius:8px;background:var(--bg);color:inherit;font:inherit;font-size:13.5px}
.fb{max-height:180px;overflow:auto;margin:8px 0;border:1px solid var(--faint);border-radius:8px}
.fb div{padding:5px 10px;cursor:pointer;font-size:13.5px}.fb div:hover{background:var(--faint)}
.row{display:flex;gap:8px;margin-top:8px}
@media(max-width:760px){body{flex-direction:column}aside{width:auto;height:auto;position:static}main{padding:20px 16px}.mini{display:none}}
</style>
</head>
<body>
<aside>
  <h1>Work Steps</h1>
  <div id="side"></div>
  <button class="gear" id="cfg">⚙ Percorsi…</button>
</aside>
<main id="main"></main>


<div id="docv" hidden>
  <div class="dv-back" id="dv-back"></div>
  <div class="dv-panel" role="dialog" aria-label="Documento">
    <header><b id="dv-title"></b><span class="res" id="dv-meta"></span><span class="sp"></span>
      <button class="db" data-doc="plan" id="dvb-plan">Piano</button><button class="db" data-doc="entrypoint" id="dvb-entrypoint">Entrypoint</button>
      <button class="dv-x" id="dv-x" title="Chiudi (Esc)">✕</button></header>
    <div class="dv-body"><nav id="dv-toc"></nav><article class="gh" id="dv-art"></article></div>
  </div>
</div>


<div id="qv" hidden>
  <div class="dv-back" id="qv-back"></div>
  <div class="qpanel" role="dialog" aria-label="Domande in attesa">
    <header><b id="qv-title">Domande in attesa</b><span class="sp"></span>
      <button class="db" id="qv-notif" title="Avvisi del browser quando arriva una nuova domanda">Avvisi: no</button>
      <button class="dv-x" id="qv-x" title="Chiudi (Esc)">✕</button></header>
    <div id="q-list"></div>
  </div>
</div>

<dialog id="dlg">
  <h3>Percorsi</h3>
  <p>Cartelle con i work (es. <code>~/progetto/.work</code>) o la radice di un repository: i work vengono rilevati da <code>entrypoint.md</code> / <code>tasks-*.md</code>.</p>
  <div id="plist"></div>
  <div class="row"><input class="t" id="pin" placeholder="/percorso/assoluto  oppure  ~/cartella"><button class="s" id="brw">Sfoglia</button><button class="s p" id="padd">Aggiungi</button></div>
  <div id="fbw" hidden><div class="row" style="margin-top:10px"><code id="fbcur" style="flex:1;font-size:12px;word-break:break-all"></code><button class="s" id="fbuse">Usa questa</button></div><div class="fb" id="fb"></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="s" id="close">Chiudi</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };

// --- mini markdown ---
function inline(s){ return inl(s); }
function md(src){
  const out = []; let list = false, fence = null, para = [];
  const endP = () => { if (para.length) out.push('<p>'+inline(para.join(' '))+'</p>'); para = []; };
  const endL = () => { if (list) { out.push('</ul>'); list = false; } };
  for (const l of src.split('\n')) {
    if (/^```/.test(l)) { if (fence) { out.push('<pre><code>'+esc(fence.join('\n'))+'</code></pre>'); fence = null; } else { endP(); endL(); fence = []; } continue; }
    if (fence) { fence.push(l); continue; }
    let m;
    if ((m = l.match(/^#{3,6}\s+(.*)/))) { endP(); endL(); out.push('<h4>'+inline(m[1])+'</h4>'); }
    else if ((m = l.match(/^\s*(?:[-*]|\d+\.)\s+(?:\[([ xX])\]\s+)?(.*)/))) { endP(); if (!list) { out.push('<ul>'); list = true; } out.push('<li>'+(m[1] ? (m[1] === ' ' ? '☐ ' : '☑ ') : '')+inline(m[2])+'</li>'); }
    else if (!l.trim()) { endP(); endL(); }
    else if (list && /^\s+/.test(l)) out[out.length-1] = out[out.length-1].replace(/<\/li>$/, ' '+inline(l.trim())+'</li>');
    else { endL(); para.push(l.trim()); }
  }
  endP(); endL(); if (fence) out.push('<pre><code>'+esc(fence.join('\n'))+'</code></pre>');
  return '<div class="md">'+out.join('')+'</div>';
}


// --- markdown completo per l'anteprima dei documenti (stile GitHub)
const slug = t => String(t).toLowerCase().replace(/[`*_~]/g, '').replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s+/g, '-');
function inl(src) {
  const codes = [];
  let s = String(src).replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (_, _q, c) => { codes.push(c.trim()); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)[^)]*\)/g, (_, a, u) => `<img alt="${a}" src="${u}" style="max-width:100%">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)/g, (_, t, u) => {
    if (/^https?:\/\//i.test(u) || /^mailto:/i.test(u)) return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
    let m;
    if ((m = u.match(/^(plan|entrypoint)\.md(#.*)?$/))) return `<a data-doc="${m[1]}">${t}</a>`;

  const g = e.target.closest('#docv [data-go], #docv [data-anchor]'); if (g) { goAnchor(g.dataset.go || g.dataset.anchor); return; }
  const st = e.target.closest('#docv [data-step]');
  if (st) { const w = curWork(), s = w?.steps.find(x => x.file === st.dataset.step); closeDoc(); if (s) { openSteps.add(w.id + s.file); store.set('open', [...openSteps]); renderMain(); document.querySelector(`.step[data-k="${CSS.escape(w.id + s.file)}"]`)?.scrollIntoView({ block: 'start' }); } }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#docv').hidden) closeDoc(); });


// --- domande in attesa: risposte dalla dashboard (registrate con `wk reply`) ---
const fld = (i, k) => (i.fields || []).find(f => f.key.toLowerCase() === k)?.value;
const pendingQ = w => w.steps.flatMap(s => s.groups.flatMap(g => g.items.filter(i => !i.done && fld(i, 'hold') && !fld(i, 'deferred')).map(i => ({ i, s }))));
const deferredQ = w => w.steps.flatMap(s => s.groups.flatMap(g => g.items.filter(i => !i.done && fld(i, 'hold') && fld(i, 'deferred')).map(i => ({ i, s }))));
function blocksN(w, id) { // voci aperte ferme (anche indirettamente) finché id non è chiusa
  const all = w.steps.flatMap(s => s.groups.flatMap(g => g.items)), seen = new Set(), q = [id];
  while (q.length) { const cur = q.shift(); for (const x of all) if (!x.done && x.id && !seen.has(x.id) && (x.deps || []).includes(cur)) { seen.add(x.id); q.push(x.id); } }
  return seen.size;
}
let qOpen = false, qSeen = new Set(), qInit = false, qNew = new Set(), qSig = '', qDraft = {};
let qNotif = store.get('qNotif', false);
function paintQ(force) {
  const w = curWork(), list = $('#q-list'); if (!w) return;
  const items = pendingQ(w), dfr = deferredQ(w);
  const sig = w.id + '|' + items.map(x => x.i.id + fld(x.i, 'hold') + (fld(x.i, 'hold_options') || '')).join('§') + '¦' + dfr.map(x => x.i.id + fld(x.i, 'deferred') + (fld(x.i, 'defer_note') || '')).join('§');
  $('#qv-title').textContent = items.length ? `Domande in attesa · ${items.length}` : 'Domande in attesa';
  $('#qv-notif').textContent = 'Avvisi: ' + (qNotif && Notification.permission === 'granted' ? 'sì' : 'no');
  if (!force && sig === qSig) return;
  qSig = sig;
  const info = `<p class="q-info">L'agente continua a lavorare sulle altre voci: appena rispondi, la voce torna disponibile e la riprende da sola.</p>`;
  const dHtml = dfr.length ? `<div class="qdh">Rimandate · ${dfr.length}</div>` + dfr.map(({ i, s }) => {
    const n = blocksN(w, i.id);
    return `<div class="qc dfr" data-qid="${esc(i.id)}">
      <div class="qh"><span class="id">${esc(i.id)}</span><span class="fx">${esc(s.title.replace(/^Step\s+\d+\s*[—-]\s*/i, ''))} · ${inline(i.text)}</span></div>
      <div class="qq fx">${inl(fld(i, 'hold'))}</div>
      <div class="qm">Rimandata il ${esc(fld(i, 'deferred'))}${fld(i, 'defer_note') ? ' · ' + esc(fld(i, 'defer_note')) : ''}${n ? ` · ferma ${n} ${n === 1 ? 'voce' : 'voci'}` : ''}</div>
      <div class="qa"><input type="text" placeholder="Rispondi ora…" value="${esc(qDraft[i.id] || '')}" data-qin="${esc(i.id)}"><button class="db go" data-qsend>Invia</button><button class="db" data-qundefer>Riporta in coda</button></div>
      <div class="qe" hidden></div></div>`;
  }).join('') : '';
  if (!items.length) { list.innerHTML = info + '<div class="sub">Nessuna domanda da rispondere.</div>' + dHtml; return; }
  list.innerHTML = info + items.map(({ i, s }) => {
    const opts = (fld(i, 'hold_options') || '').split(' | ').map(x => x.trim()).filter(Boolean), def = fld(i, 'hold_default');
    return `<div class="qc ${qNew.has(i.id) ? 'new' : ''}" data-qid="${esc(i.id)}">
      <div class="qh"><span class="id">${esc(i.id)}</span><span class="fx">${esc(s.title.replace(/^Step\s+\d+\s*[—-]\s*/i, ''))} · ${inline(i.text)}</span></div>
      <div class="qq fx">${inl(fld(i, 'hold'))}</div>
      ${opts.length ? `<div class="qo">${opts.map(o => `<button class="opt ${def === o ? 'def' : ''}" data-qopt="${esc(o)}">${esc(o)}${def === o ? ' · proposta' : ''}</button>`).join('')}</div>` : ''}
      <div class="qa"><input type="text" placeholder="${opts.length ? 'Oppure scrivi un’altra risposta…' : 'Scrivi la risposta…'}" value="${esc(qDraft[i.id] || '')}" data-qin="${esc(i.id)}"><button class="db go" data-qsend>Invia</button>${def && !opts.length ? `<button class="db" data-qopt="${esc(def)}">Usa la proposta: ${esc(def)}</button>` : ''}<button class="db" data-qdefer title="Toglie la domanda dalla coda senza rispondere">Rimanda</button></div>
      <div class="qd" hidden><input type="text" placeholder="Cosa aspetti? (facoltativo)" data-qnote="${esc(i.id)}"><button class="db go" data-qdefer-ok>Conferma rinvio</button></div>
      <div class="qe" hidden></div></div>`;
  }).join('') + dHtml;
}
function openQ(focusId) {
  qOpen = true; qNew.clear(); $('#qv').hidden = false; paintQ(true);
  if (focusId) document.querySelector(`.qc[data-qid="${CSS.escape(focusId)}"]`)?.scrollIntoView({ block: 'center' });
}
function closeQ() { qOpen = false; $('#qv').hidden = true; }
async function sendAnswer(card, answer) {
  const id = card.dataset.qid, err = card.querySelector('.qe'); answer = (answer || '').trim();
  if (!answer) return;
  card.classList.add('sent'); err.hidden = true;
  try {
    const r = await fetch('/api/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ work: curWork().id, id, answer }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    delete qDraft[id]; await load();
  } catch (e) { card.classList.remove('sent'); err.textContent = 'Non registrata: ' + e.message; err.hidden = false; }
}
async function postQ(card, path, extra) {
  const id = card.dataset.qid, err = card.querySelector('.qe');
  card.classList.add('sent'); err.hidden = true;
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ work: curWork().id, id, ...extra }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    await load();
  } catch (e) { card.classList.remove('sent'); err.textContent = 'Non registrata: ' + e.message; err.hidden = false; }
}
function checkNewQuestions() {
  const all = allWorks().flatMap(w => pendingQ(w).map(x => ({ id: x.i.id, q: fld(x.i, 'hold'), w: w.title })));
  const ids = new Set(all.map(x => x.id));
  if (qInit) {
    const fresh = all.filter(x => !qSeen.has(x.id));
    fresh.forEach(x => qNew.add(x.id));
    if (fresh.length && qNotif && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(fresh.length === 1 ? 'Nuova domanda dall’agente' : `${fresh.length} nuove domande dall’agente`, { body: fresh.map(x => x.q).join('\n').slice(0, 200) }); } catch {}
    }
  }
  qSeen = ids; qInit = true;
  document.title = (all.length ? `(${all.length}) ` : '') + 'Work Steps';
}
document.addEventListener('click', e => {
  const open = e.target.closest('[data-qopen]'); if (open) { openQ(open.dataset.qopen || null); return; }
  if (e.target.closest('#qv-x, #qv-back')) { closeQ(); return; }
  if (e.target.closest('#qv-notif')) {
    if (!('Notification' in window)) return;
    if (qNotif) { qNotif = false; store.set('qNotif', false); paintQ(true); return; }
    Notification.requestPermission().then(p => { qNotif = p === 'granted'; store.set('qNotif', qNotif); paintQ(true); });
    return;
  }
  const opt = e.target.closest('#qv [data-qopt]'); if (opt) { sendAnswer(opt.closest('.qc'), opt.dataset.qopt); return; }
  const dfb = e.target.closest('#qv [data-qdefer]'); if (dfb) { const r = dfb.closest('.qc').querySelector('.qd'); r.hidden = !r.hidden; if (!r.hidden) r.querySelector('input').focus(); return; }
  const dfo = e.target.closest('#qv [data-qdefer-ok]'); if (dfo) { const c = dfo.closest('.qc'); postQ(c, '/api/defer', { note: c.querySelector('[data-qnote]').value }); return; }
  const und = e.target.closest('#qv [data-qundefer]'); if (und) { postQ(und.closest('.qc'), '/api/undefer', {}); return; }
  const snd = e.target.closest('#qv [data-qsend]'); if (snd) { const c = snd.closest('.qc'); sendAnswer(c, c.querySelector('input').value); }
}, true);
document.addEventListener('input', e => { const i = e.target.dataset?.qin; if (i) qDraft[i] = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset?.qnote !== undefined) { e.preventDefault(); e.target.closest('.qc').querySelector('[data-qdefer-ok]').click(); return; }
  if (e.key === 'Enter' && e.target.dataset?.qin) { e.preventDefault(); sendAnswer(e.target.closest('.qc'), e.target.value); }
  if (e.key === 'Escape' && qOpen) closeQ();
});

// --- config ---
let paths = [];
async function showCfg(){
  paths = (await (await fetch('/api/config')).json()).paths;
  $('#plist').innerHTML = paths.length ? paths.map((p,i) => `<div class="pr"><code>${esc(p)}</code><button class="s" data-rm="${i}">Rimuovi</button></div>`).join('') : '<p>Nessun percorso configurato.</p>';
}
async function savePaths(){
  await fetch('/api/config', { method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({ paths }) });
  await showCfg(); load();
}
$('#cfg').onclick = async () => { await showCfg(); $('#dlg').showModal(); };
$('#close').onclick = () => $('#dlg').close();
$('#plist').onclick = e => { const i = e.target.dataset.rm; if (i !== undefined) { paths.splice(+i,1); savePaths(); } };
$('#padd').onclick = () => { const v = $('#pin').value.trim(); if (v) { paths.push(v); $('#pin').value=''; savePaths(); } };
$('#pin').onkeydown = e => { if (e.key === 'Enter') $('#padd').click(); };
async function browse(p){
  const r = await (await fetch('/api/ls?path='+encodeURIComponent(p))).json();
  if (r.error) return;
  $('#fbw').hidden = false; $('#fbcur').textContent = r.dir + (r.isWork ? '  ✓ work' : '');
  $('#fb').innerHTML = `<div data-p="${esc(r.parent)}">↑ ..</div>` + r.dirs.map(d => `<div data-p="${esc(r.dir.replace(/\/$/,'')+'/'+d)}">${esc(d)}</div>`).join('');
}
$('#brw').onclick = () => browse($('#pin').value.trim() || '~');
$('#fb').onclick = e => { const p = e.target.dataset.p; if (p) browse(p); };
$('#fbuse').onclick = () => { $('#pin').value = $('#fbcur').textContent.replace(/\s+✓ work$/,''); };

load(); setInterval(() => { refreshDoc(); if (!$('#dlg').open && !getSelection().toString()) load(); }, 5000);
</script>
